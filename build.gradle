plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
    id 'maven-publish'
}

version = project.property('mod_version')
group = project.property('maven_group')

repositories {
    mavenCentral()
}

dependencies {
    // 26.x ships unobfuscated, so there's no mappings dependency and no remapping
    // (mod* configurations) — code is written directly against Mojang's own names.
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${project.property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_version')}"

    // LuckPerms API only (interfaces/classes, not the mod itself) — used to read the
    // "chat-color" group meta. Actual LuckPerms mod must be installed on the server;
    // this is a compile-time-only dependency, not bundled or remapped.
    implementation "net.luckperms:api:5.4"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/fabric/java']
        }
        resources {
            srcDirs = ['src/fabric/resources']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}