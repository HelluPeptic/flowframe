name: Flowframe
version: '${project.version}'
main: com.flowframe.flowframe.Flowframe
api-version: '1.21'
description: QoL server-side plugin - grief protection, phantom relocation, right-click harvest
authors: [ flowframe ]
folia-supported: true
soft-depend: [LuckPerms]

commands:
  keepinv:
    description: Toggle keep inventory opt-out for yourself.
    usage: /keepinv
  endtoggle:
    description: Toggle end portal access for all players (operator only).
    usage: /endtoggle

permissions:
  flowframe.endtoggle:
    description: Allows toggling end portals on and off.
    default: op

